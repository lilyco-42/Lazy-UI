[package]
name = "demo"
version = "0.1.0"
edition = "2021"

[dependencies]
ply-engine = {
  version = "1.1",
  features = [
    "audio",
    "built-in-shaders",
    "net",
    "net-json",
    "storage",
    "text-styling",
    "tinyvg"
  ]
}

[build-dependencies]
ply-engine = {
  version = "1.1",
  default-features = false,
  features = ["shader-build"]
}
# This line needs to come before anything else in Cargo.toml
#
