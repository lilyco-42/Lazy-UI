[package]
name = "lazy-ply"
version = "0.1.0"
edition = "2021"

# Android APK 构建配置(plyx apk / cargo-quad-apk)
[package.metadata.android]
assets = "assets/"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# 禁用 fontconfig: 兼容 HarmonyOS(ohos) 下无 -lX11/pango 系统库的交叉链接
fontdb = { version = "0.16", default-features = false, features = ["fs", "memmap", "std"] }
log = "0.4"
rust-i18n = { version = "4.2", features = ["log-miss-tr"] }
ply-engine = { version = "1.1", default-features = false, features = ["a11y", "built-in-shaders", "text-styling"] }

# meme_grid (虚拟化图片/表情网格) 可选依赖；`cargo build --features image-grid` 启用
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"], optional = true }
indexmap = { version = "2", optional = true }

[features]
default = []
image-grid = ["dep:image", "dep:indexmap"]

