# combo.toml — ComboBox / dropdown stylesheet (like CSS).
# Unset fields fall back to the M3 theme in combo.rs.

height = 56.0          # closed field height px
radius = 4.0           # field corner radius
gap = 8.0              # gap between value text and caret
pad_x = 16.0           # field horizontal padding
font_size = 16         # value + option font size
item_height = 48.0     # menu row height px
background = 0xE7E0EC  # closed field fill
text_color = 0x1C1B1F
arrow_color = 0x49454F
menu_bg = 0xF3EDF7     # open menu fill
menu_radius = 4.0
menu_border = 0xCAC4D0
selected_bg = 0xE8DEF8 # highlighted row
selected_fg = 0x1D192B
