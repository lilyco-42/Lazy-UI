# sidebar.toml — Sidebar stylesheet (like CSS).
# Unset fields fall back to the M3 theme in container.rs.
# Width/size comes from app_layout.toml.

gap = 4              # spacing between nav items
padding = 12         # inner padding px
scroll = true        # scroll when content overflows
background = 0xF7F2FA # surface_container_low
border = 0xCAC4D0    # right edge outline
